<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>无名杀</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #eee4d0;
        --ink: #171717;
        --red: #a82b24;
        --gold: #d9ad52;
        --stone: #2b2a27;
        --line: rgba(238, 228, 208, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(168, 43, 36, 0.2), transparent 38%),
          radial-gradient(circle at 82% 18%, rgba(217, 173, 82, 0.18), transparent 32%),
          #11100e;
        color: var(--paper);
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      }

      main {
        width: min(860px, calc(100vw - 48px));
        display: grid;
        gap: 24px;
        padding: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 23, 23, 0.88);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }

      header {
        display: grid;
        gap: 10px;
      }

      .mark {
        width: 52px;
        aspect-ratio: 1;
        border: 2px solid var(--gold);
        display: grid;
        place-items: center;
        color: var(--gold);
        font-size: 28px;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 64ch;
        color: rgba(238, 228, 208, 0.78);
        line-height: 1.75;
        font-size: 16px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--gold);
        border-radius: 6px;
        background: var(--gold);
        color: var(--ink);
        font: 700 15px/1 system-ui, sans-serif;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--paper);
        border-color: var(--line);
      }

      button:focus-visible {
        outline: 3px solid rgba(217, 173, 82, 0.45);
        outline-offset: 3px;
      }

      #status {
        min-height: 24px;
        color: rgba(238, 228, 208, 0.7);
        font: 14px/1.6 system-ui, sans-serif;
      }

      code {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">杀</div>
        <h1>无名杀</h1>
        <p>
          未找到完整包。请选择包含 <code>index.html</code> 或 <code>app.html</code>
          的无名杀目录；客户端会复制到可写的用户数据目录后启动。
        </p>
      </header>

      <section class="actions" aria-label="actions">
        <button id="choose">选择完整包目录</button>
        <button id="openGame" class="secondary">打开游戏目录</button>
        <button id="openData" class="secondary">打开用户数据</button>
      </section>

      <div id="status" role="status"></div>
    </main>

    <script>
      const status = document.querySelector("#status");
      const setStatus = (message) => {
        status.textContent = message || "";
      };

      document.querySelector("#choose").addEventListener("click", async () => {
        setStatus("正在检查目录...");
        const result = await window.nonameClient.chooseGameDir();
        setStatus(result.ok ? "已导入，正在启动。" : result.message);
      });

      document.querySelector("#openGame").addEventListener("click", async () => {
        const dir = await window.nonameClient.openGameDir();
        setStatus(`已打开: ${dir}`);
      });

      document.querySelector("#openData").addEventListener("click", async () => {
        const dir = await window.nonameClient.openUserDataDir();
        setStatus(`已打开: ${dir}`);
      });
    </script>
  </body>
</html>
